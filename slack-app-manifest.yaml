# Slack app manifest for Agent Doorbell.
#
# To use it:
#   1. Go to https://api.slack.com/apps and choose Create New App -> From a manifest.
#   2. Pick your workspace, paste this file, and create the app.
#   3. Choose Install to Workspace and approve it.
#   4. Under OAuth & Permissions, copy the User OAuth Token (it starts with xoxp-).
#      Save it in a file with mode 600 for the daemon to read (see the README).
#
# This is an internal app for your own workspace. It has user token scopes only, all of them
# read-only: no bot user, no bot scopes, no event subscriptions, no Socket Mode and no
# redirect URL. Agent Doorbell polls Slack and never posts.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Agent Doorbell
  description: Wakes your AI agents only when a Slack message needs them. Read-only.
oauth_config:
  scopes:
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - usergroups:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
