# Developer Certificate of Origin: every commit in a pull request is signed off
# (CONTRIBUTING.md). Runs in the repository; no outside service.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Every non-merge commit in BASE..HEAD must carry a Signed-off-by trailer naming the
      # commit author's email. Commits by GitHub bots (Dependabot) are exempt.
      - name: Check sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          checked=0
          while IFS= read -r sha; do
            email=$(git log -1 --format=%ae "$sha")
            subject=$(git log -1 --format=%s "$sha")
            case $email in *'[bot]@users.noreply.github.com') continue ;; esac
            checked=$((checked + 1))
            signoffs=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if ! grep -qiF "<$email>" <<<"$signoffs"; then
              echo "::error::${sha:0:12} \"$subject\" has no Signed-off-by line for its author <$email>"
              bad=$((bad + 1))
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$bad" -gt 0 ]; then
            echo
            echo "$bad commit(s) are not signed off. Sign them off and force-push the branch:"
            echo "  git rebase --signoff $BASE_SHA"
            echo "  git push --force-with-lease"
            echo "See CONTRIBUTING.md, \"Developer Certificate of Origin\"."
            exit 1
          fi
          echo "dco: $checked commit(s) signed off"
