# Release: a tag vX.Y.Z builds the sdist and wheel, publishes a GitHub Release with both and the
# matching CHANGELOG.md section, then publishes to PyPI in a separate job.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pip install dist/*.whl
          v=$(python -c 'import doorbell; print(doorbell.__version__)')
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $v"
            exit 1
          fi
      - name: Extract the changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          awk -v v="$v" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $v; see the full changelog in the repository." > release-notes.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag

  # Needs the PyPI trusted publisher configured first: on pypi.org, add a (pending) publisher for
  # this repository with workflow release.yml and environment pypi. Also create a GitHub
  # environment named pypi (optionally with required reviewers).
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-doorbell
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
